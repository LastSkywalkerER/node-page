name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU (multi-arch emulation for the arm64 final stage)
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          # Semver tags on v* pushes: vX.Y.Z and X.Y (alongside latest on main).
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          # Branch builds: <branch>-<sha>. {{branch}} is empty on BOTH tag pushes
          # and pull_requests, which would yield the invalid tag "-<sha>" and fail
          # the build — so only emit it for real branch refs. Tag pushes are
          # covered by the semver tags above; PRs get a pr-prefixed sha tag below.
          type=sha,prefix={{branch}}-,enable=${{ startsWith(github.ref, 'refs/heads/') }}
          type=sha,prefix=pr-${{ github.event.number }}-,enable=${{ github.event_name == 'pull_request' }}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        # Push on any push event (main branch or a v* tag); PRs build only.
        push: ${{ github.event_name == 'push' }}
        provenance: false
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  # Manual trigger: lets us build the stable :latest image for a v* tag that was
  # created by the Release workflow (a tag created by Actions' GITHUB_TOKEN does
  # not auto-trigger this push-based workflow). Dispatch against the tag ref.
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Full history + tags so the beta version step can find the latest
        # release tag and count commits since it (git describe / rev-list).
        fetch-depth: 0

    - name: Set up QEMU (multi-arch emulation for the arm64 final stage)
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          # Semver tags on v* pushes: vX.Y.Z and X.Y. The semver build also
          # stamps version.Version = X.Y.Z (vs "main" for branch builds), so a
          # released image reports a clean version and the in-app updater can
          # semver-compare future releases (managed-externally deploys then fire
          # the orchestrator deploy webhook).
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          # Branch builds: <branch>-<sha>. {{branch}} is empty on BOTH tag pushes
          # and pull_requests, which would yield the invalid tag "-<sha>" and fail
          # the build — so only emit it for real branch refs. Tag pushes are
          # covered by the semver tags above; PRs get a pr-prefixed sha tag below.
          type=sha,prefix={{branch}}-,enable=${{ startsWith(github.ref, 'refs/heads/') }}
          type=sha,prefix=pr-${{ github.event.number }}-,enable=${{ github.event_name == 'pull_request' }}
          # :latest follows ONLY v* release tags — NEVER main pushes. A main
          # build stamps version.Version="main" (non-semver); if such an image
          # ever became :latest, every deployment auto-pulling it would report
          # "Current main" and the in-app updater would go blind — it can't
          # semver-compare, so it falls back to a build-date heuristic that reads
          # "you're on the latest" forever (the main build is as new as the
          # release it raced). Tag-only :latest keeps it a clean-versioned
          # release image so auto-update always works. (Main still publishes a
          # pullable dev image as <branch>-<sha> above.)
          type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          # :beta is the moving image for the BETA release channel and tracks
          # main HEAD — every change ships to main as beta immediately, and only
          # an explicit promotion cuts a v* tag (→ :latest, the stable channel).
          # Unlike :latest this intentionally points at a non-semver "main"
          # build: beta-channel nodes detect updates via the build-date heuristic
          # and pull :beta on "update now"/auto-update.
          type=raw,value=beta,enable=${{ github.ref == 'refs/heads/main' }}

    - name: Build metadata
      id: buildmeta
      run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

    - name: Compute version
      id: ver
      # Produce a readable, ordered version string stamped into the binary
      # (version.Version, shown by /version):
      #   • v* tag push  → the clean release version (e.g. 0.7.5)
      #   • main (beta)  → next-patch prerelease: <maj>.<min>.<patch+1>-beta.<N>
      #     where N = commits since the latest tag. So beta sorts AFTER the last
      #     release and BEFORE the next one (0.7.4 < 0.7.5-beta.14 < 0.7.5), and
      #     each push bumps N — readable instead of the opaque "main".
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
        else
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
          BASE=${LATEST#v}
          IFS='.' read -r MA MI PA <<< "${BASE%%-*}"
          MA=${MA:-0}; MI=${MI:-0}; PA=${PA:-0}
          COUNT=$(git rev-list "${LATEST}..HEAD" --count 2>/dev/null || git rev-list HEAD --count)
          echo "version=${MA}.${MI}.$((PA+1))-beta.${COUNT}" >> "$GITHUB_OUTPUT"
        fi

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        # Push on any push event (main branch or a v* tag) or a manual dispatch
        # (used to build :latest for a Release-workflow-created tag); PRs build only.
        push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        provenance: false
        # COMMIT/DATE feed the in-app updater: non-semver builds (e.g. :latest
        # from main) detect releases by comparing the release published_at
        # against the build date.
        build-args: |
          VERSION=${{ steps.ver.outputs.version }}
          COMMIT=${{ github.sha }}
          DATE=${{ steps.buildmeta.outputs.date }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU (multi-arch emulation for the arm64 final stage)
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          # Semver tags on v* pushes: vX.Y.Z and X.Y. The semver build also
          # stamps version.Version = X.Y.Z (vs "main" for branch builds), so a
          # released image reports a clean version and the in-app updater can
          # semver-compare future releases (managed-externally deploys then fire
          # the orchestrator deploy webhook).
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          # Branch builds: <branch>-<sha>. {{branch}} is empty on BOTH tag pushes
          # and pull_requests, which would yield the invalid tag "-<sha>" and fail
          # the build — so only emit it for real branch refs. Tag pushes are
          # covered by the semver tags above; PRs get a pr-prefixed sha tag below.
          type=sha,prefix={{branch}}-,enable=${{ startsWith(github.ref, 'refs/heads/') }}
          type=sha,prefix=pr-${{ github.event.number }}-,enable=${{ github.event_name == 'pull_request' }}
          # :latest follows BOTH main (dev) and v* tags (release). A release
          # build runs after its main build, so cutting vX.Y.Z makes :latest the
          # clean-versioned release image that dokploy/valheim pull + redeploy.
          type=raw,value=latest,enable=${{ github.event_name == 'push' }}

    - name: Build metadata
      id: buildmeta
      run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        # Push on any push event (main branch or a v* tag); PRs build only.
        push: ${{ github.event_name == 'push' }}
        provenance: false
        # COMMIT/DATE feed the in-app updater: non-semver builds (e.g. :latest
        # from main) detect releases by comparing the release published_at
        # against the build date.
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}
          COMMIT=${{ github.sha }}
          DATE=${{ steps.buildmeta.outputs.date }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

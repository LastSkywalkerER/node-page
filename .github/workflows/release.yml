name: Release

# Publishes per-OS installers PLUS raw-binary archives as a GitHub Release:
#   - Ubuntu/Debian: node-stats_<v>_amd64.deb and _arm64.deb  (binary + systemd service)
#   - macOS (Apple Silicon): node-stats_<v>_darwin_arm64.dmg   (drag node-stats.app → Applications)
#   - Windows: node-stats_<v>_windows_amd64_setup.exe          (NSIS installer)
#   - Raw binaries for the in-app self-updater (`node-stats update`):
#       node-stats_<tag>_{linux_amd64,linux_arm64,darwin_arm64}.tar.gz,
#       node-stats_<tag>_windows_amd64.zip, and SHA256SUMS.
# Three ways this runs:
#   1. STABLE: push a tag   git tag v0.1.2 && git push origin v0.1.2
#   2. STABLE: Actions tab → "Release" → "Run workflow", enter a version like v0.1.2
#   3. BETA (automatic): every push to main publishes a prerelease
#      v<maj>.<min>.<patch+1>-beta.<N> (N = commits since the latest stable tag),
#      with the SAME version the Docker :beta image gets — so native/LXC installs
#      on the beta channel self-update straight from main, no manual tagging.
#      Version is computed by scripts/ci-version.sh (shared with docker.yml).
# (The "Build and Push Docker Image" workflow is separate — it publishes the
#  container image to GHCR, not a GitHub Release.)
#
# NOTE on signing: the .dmg/.app and the .exe are NOT Apple-notarized / Windows-
# code-signed, so a browser download triggers Gatekeeper / SmartScreen once
# (right-click → Open on macOS; "More info → Run anyway" on Windows). A seamless
# download needs an Apple Developer ID + a Windows code-signing cert — wire those
# (as CI secrets) to remove the one-time prompt.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag to create/publish (e.g. v0.1.2)'
        required: true
        type: string

permissions:
  contents: write

# Coalesce rapid main pushes: a newer beta build cancels the in-progress one
# (saves runner minutes and guarantees the published beta is the latest commit).
# Stable tag releases run in their own per-tag group and are NEVER cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  # Resolve the version + prerelease flag once, so every build job and the
  # publish step agree (and match the Docker image built from the same commit).
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}       # v-prefixed (tag + asset names)
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so ci-version.sh can find the latest stable tag
          # and count commits since it.
          fetch-depth: 0
      - id: v
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.version }}"                     # operator-supplied, e.g. v0.1.2
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME}"                        # the pushed stable tag
          else
            VER="v$(bash scripts/ci-version.sh)"            # main push → rolling beta
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          # A '-' suffix (…-beta.N) marks a GitHub prerelease: the in-app updater's
          # beta channel picks it up while the stable channel (/releases/latest) skips it.
          if [[ "$VER" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # Build the frontend once; every binary embeds the same dist.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build frontend
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          yarn build
      - uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: internal/webui/dist
          if-no-files-found: error

  # Ubuntu/Debian .deb (amd64 + arm64): binary → /usr/bin + systemd service.
  linux:
    needs: [version, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: internal/webui/dist
      - name: Build .deb
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          if [ -z "${VERSION}" ]; then echo "version is empty"; exit 1; fi
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build -tags embed_dist \
            -ldflags "-s -w -X system-stats/internal/version.Version=${VERSION} -X system-stats/internal/version.Commit=${COMMIT} -X system-stats/internal/version.Date=${DATE}" \
            -o node-stats ./cmd/server
          mkdir -p dist
          # Raw-binary tarball for the in-app self-updater (`node-stats update`),
          # which fetches node-stats_<tag>_<os>_<arch>.tar.gz and swaps the binary.
          # The .deb below is for apt / install.sh; the tarball is for self-update.
          tar -czf "dist/node-stats_${VERSION}_linux_${{ matrix.goarch }}.tar.gz" node-stats
          # nfpm runs on the runner → install it for the host arch (not the target).
          GOOS="$(go env GOHOSTOS)" GOARCH="$(go env GOHOSTARCH)" \
            go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          export PKG_ARCH="${{ matrix.goarch }}" PKG_VERSION="${VERSION#v}"
          "$(go env GOPATH)/bin/nfpm" package -f packaging/nfpm.yaml -p deb -t dist/
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux-${{ matrix.goarch }}
          path: dist
          if-no-files-found: error

  # Windows NSIS installer (amd64).
  windows:
    needs: [version, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: internal/webui/dist
      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build installer .exe
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          if [ -z "${VERSION}" ]; then echo "version is empty"; exit 1; fi
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags embed_dist \
            -ldflags "-s -w -X system-stats/internal/version.Version=${VERSION} -X system-stats/internal/version.Commit=${COMMIT} -X system-stats/internal/version.Date=${DATE}" \
            -o node-stats.exe ./cmd/server
          mkdir -p dist
          # Raw-binary zip for the in-app self-updater (node-stats.exe inside).
          zip -j "dist/node-stats_${VERSION}_windows_amd64.zip" node-stats.exe
          # File/OutFile resolve relative to the .nsi dir — pass absolute paths.
          makensis -DVERSION="${VERSION#v}" \
            -DEXE="${PWD}/node-stats.exe" \
            -DOUTFILE="${PWD}/dist/node-stats_${VERSION}_windows_amd64_setup.exe" \
            packaging/windows-installer.nsi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist
          if-no-files-found: error

  # macOS .dmg (Apple Silicon) — node-stats.app launches the server + opens the dashboard.
  macos:
    needs: [version, frontend]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: internal/webui/dist
      - name: Build .dmg
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          if [ -z "${VERSION}" ]; then echo "version is empty"; exit 1; fi
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -tags embed_dist \
            -ldflags "-s -w -X system-stats/internal/version.Version=${VERSION} -X system-stats/internal/version.Commit=${COMMIT} -X system-stats/internal/version.Date=${DATE}" \
            -o node-stats ./cmd/server
          mkdir -p dist
          # Raw-binary tarball for the in-app self-updater (the .dmg is for humans).
          tar -czf "dist/node-stats_${VERSION}_darwin_arm64.tar.gz" node-stats
          bash packaging/make-macos-dmg.sh "${VERSION}" node-stats "dist/node-stats_${VERSION}_darwin_arm64.dmg"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: dist
          if-no-files-found: error

  # Publish ONLY the installers.
  release:
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          # Over the release assets only (exclude SHA256SUMS itself). The in-app
          # self-updater verifies its downloaded archive against this file.
          sha256sum node-stats_* > SHA256SUMS
          cat SHA256SUMS
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          # On a main push this tag does not exist yet — action-gh-release creates
          # it at the pushed commit. A '-' suffix → GitHub prerelease (beta channel);
          # plain vX.Y.Z → normal stable release.
          tag_name: ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          files: |
            dist/*.deb
            dist/*.dmg
            dist/*.exe
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
      # Every main push cuts a new beta prerelease, so they pile up. Keep the
      # newest few and delete older beta prereleases (release + tag). Stable
      # releases are never touched. Best-effort — never fails the publish.
      - name: Prune old beta prereleases
        if: needs.version.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: '10'
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName,isPrerelease,createdAt \
            | jq -r --argjson keep "$KEEP" '
                [ .[] | select(.isPrerelease and (.tagName | test("-beta\\."))) ]
                | sort_by(.createdAt) | reverse | .[$keep:] | .[].tagName
              ' \
            | while read -r tag; do
                [ -n "$tag" ] || continue
                echo "pruning old beta prerelease $tag"
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
              done

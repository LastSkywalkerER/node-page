name: Release

# Publishes ONLY clean per-OS installers as a GitHub Release:
#   - Ubuntu/Debian: node-stats_<v>_amd64.deb and _arm64.deb  (binary + systemd service)
#   - macOS (Apple Silicon): node-stats_<v>_darwin_arm64.dmg   (drag node-stats.app → Applications)
#   - Windows: node-stats_<v>_windows_amd64_setup.exe          (NSIS installer)
# No tarballs/zip/rpm/checksums. Two ways to cut a release:
#   1. push a tag:   git tag v0.1.2 && git push origin v0.1.2
#   2. Actions tab → "Release" → "Run workflow", enter a version like v0.1.2
# (The "Build and Push Docker Image" workflow is separate — it publishes the
#  container image to GHCR, not a GitHub Release.)
#
# NOTE on signing: the .dmg/.app and the .exe are NOT Apple-notarized / Windows-
# code-signed, so a browser download triggers Gatekeeper / SmartScreen once
# (right-click → Open on macOS; "More info → Run anyway" on Windows). A seamless
# download needs an Apple Developer ID + a Windows code-signing cert — wire those
# (as CI secrets) to remove the one-time prompt.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag to create/publish (e.g. v0.1.2)'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  # Build the frontend once; every binary embeds the same dist.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build frontend
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          yarn build
      - uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: internal/webui/dist
          if-no-files-found: error

  # Ubuntu/Debian .deb (amd64 + arm64): binary → /usr/bin + systemd service.
  linux:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: internal/webui/dist
      - name: Build .deb
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}"
          if [ -z "${VERSION}" ]; then echo "RELEASE_VERSION is empty"; exit 1; fi
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build -tags embed_dist \
            -ldflags "-s -w -X system-stats/internal/version.Version=${VERSION} -X system-stats/internal/version.Commit=${COMMIT} -X system-stats/internal/version.Date=${DATE}" \
            -o node-stats ./cmd/server
          # nfpm runs on the runner → install it for the host arch (not the target).
          GOOS="$(go env GOHOSTOS)" GOARCH="$(go env GOHOSTARCH)" \
            go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          export PKG_ARCH="${{ matrix.goarch }}" PKG_VERSION="${VERSION#v}"
          mkdir -p dist
          "$(go env GOPATH)/bin/nfpm" package -f packaging/nfpm.yaml -p deb -t dist/
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux-${{ matrix.goarch }}
          path: dist
          if-no-files-found: error

  # Windows NSIS installer (amd64).
  windows:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: internal/webui/dist
      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build installer .exe
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}"
          if [ -z "${VERSION}" ]; then echo "RELEASE_VERSION is empty"; exit 1; fi
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags embed_dist \
            -ldflags "-s -w -X system-stats/internal/version.Version=${VERSION} -X system-stats/internal/version.Commit=${COMMIT} -X system-stats/internal/version.Date=${DATE}" \
            -o node-stats.exe ./cmd/server
          mkdir -p dist
          # File/OutFile resolve relative to the .nsi dir — pass absolute paths.
          makensis -DVERSION="${VERSION#v}" \
            -DEXE="${PWD}/node-stats.exe" \
            -DOUTFILE="${PWD}/dist/node-stats_${VERSION}_windows_amd64_setup.exe" \
            packaging/windows-installer.nsi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist
          if-no-files-found: error

  # macOS .dmg (Apple Silicon) — node-stats.app launches the server + opens the dashboard.
  macos:
    needs: frontend
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: internal/webui/dist
      - name: Build .dmg
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}"
          if [ -z "${VERSION}" ]; then echo "RELEASE_VERSION is empty"; exit 1; fi
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -tags embed_dist \
            -ldflags "-s -w -X system-stats/internal/version.Version=${VERSION} -X system-stats/internal/version.Commit=${COMMIT} -X system-stats/internal/version.Date=${DATE}" \
            -o node-stats ./cmd/server
          mkdir -p dist
          bash packaging/make-macos-dmg.sh "${VERSION}" node-stats "dist/node-stats_${VERSION}_darwin_arm64.dmg"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: dist
          if-no-files-found: error

  # Publish ONLY the installers.
  release:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          files: |
            dist/*.deb
            dist/*.dmg
            dist/*.exe
          generate_release_notes: true

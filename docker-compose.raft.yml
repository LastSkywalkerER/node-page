      - "7101:7000"
    environment:
      - ADDR=:9090
      - DB_DSN=/app/data/stats.db
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_SECRET=${REFRESH_SECRET}
      - RAFT_ENABLED=true
      - RAFT_CLUSTER_ID=public
      - RAFT_NODE_ID=public-1
      - RAFT_BIND_ADDR=0.0.0.0:7000
      - RAFT_ADVERTISE_ADDR=public-1:7000
      - RAFT_DATA_DIR=/app/data/raft
      - RAFT_BOOTSTRAP=true
      - RAFT_PEERS=public-2@public-2:7000,public-3@public-3:7000
      - RAFT_ADVERTISE_PUBLIC_URL=http://public-1:9090
      - RAFT_BRIDGE_ENABLED=true
      - RAFT_BRIDGE_SHARED_SECRET=${BRIDGE_SECRET}
      - RAFT_BRIDGE_REMOTE_SEEDS=http://local-1:9090,http://local-2:9090,http://local-3:9090

  public-2:

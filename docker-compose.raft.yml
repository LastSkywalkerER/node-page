      - RAFT_BOOTSTRAP=false
      - RAFT_ADVERTISE_PUBLIC_URL=http://local-3:9090
      - RAFT_BRIDGE_ENABLED=true
      - RAFT_BRIDGE_SHARED_SECRET=${BRIDGE_SECRET}

  # ------------------------ Public cluster -----------------------------

  public-1:

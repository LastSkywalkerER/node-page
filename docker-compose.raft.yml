      - RAFT_ENABLED=true
      - RAFT_CLUSTER_ID=public
      - RAFT_NODE_ID=public-2
      - RAFT_BIND_ADDR=0.0.0.0:7000
      - RAFT_ADVERTISE_ADDR=public-2:7000
      - RAFT_DATA_DIR=/app/data/raft
      - RAFT_BOOTSTRAP=false
      - RAFT_ADVERTISE_PUBLIC_URL=http://public-2:9090
      - RAFT_BRIDGE_ENABLED=true

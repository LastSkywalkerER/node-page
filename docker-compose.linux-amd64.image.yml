# Linux amd64 for Dokploy / Traefik — PREBUILT IMAGE variant. Same wiring as
# docker-compose.linux-amd64.yml but pulls ghcr.io instead of building from
# source: no Docker Hub base-image pulls (avoids the anonymous 429 rate limit
# on golang/node/alpine) and much faster deploys. GHCR has no anonymous pull
# limits for public images.
#   docker compose -f docker-compose.linux-amd64.image.yml --env-file .env up -d
# Pin a release with NODE_STATS_IMAGE=ghcr.io/lastskywalkerer/node-page:vX.Y.Z
#
# All mutable state (runtime .env with RAFT_*/secrets, SQLite DB, Raft log)
# lives in the named volume: dokploy re-clones the compose project on every
# redeploy, so relative bind mounts (./.env, ./data) would be wiped each time
# and the node would forget its cluster + uplink configuration.
services:
  node-stats:
    platform: linux/amd64
    image: ${NODE_STATS_IMAGE:-ghcr.io/lastskywalkerer/node-page:latest}
    # network_mode: host
    volumes:
      - node-stats-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro
    pid: host
    ipc: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    environment:
      - ADDR=:9090
      # Keep the runtime .env inside the persistent volume (see header).
      - NODE_STATS_ENV_FILE=/app/data/.env

      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ETC=/host/etc
      - HOST_ROOT=/host

volumes:
  node-stats-data:

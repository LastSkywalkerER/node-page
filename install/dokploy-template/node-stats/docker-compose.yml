# node-stats dokploy template (blueprints/node-stats).
# Conventions per Dokploy/templates: no container_name, no explicit
# dokploy-network (injected), expose-style ports only (domains route via
# Traefik to the container port). All mutable state lives in named volumes —
# dokploy re-clones the compose project on every redeploy.
services:
  node-stats:
    image: ghcr.io/lastskywalkerer/node-page:latest
    # Re-pull :latest on every (re)deploy - plain `up -d` would keep the
    # stale local tag and the Deploy button would be a no-op update-wise.
    pull_policy: always
    volumes:
      - node-stats-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro
      # Lets the Applications view derive public URLs from dokploy's Traefik
      # file-provider config:
      - /etc/dokploy/traefik/dynamic:/etc/dokploy/traefik/dynamic:ro
    pid: host
    ipc: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    mem_limit: 1g
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ADDR=:9090
      # Cap the Go heap below mem_limit so the GC works rather than the OOM killer.
      - GOMEMLIMIT=${GOMEMLIMIT:-768MiB}
      # Runtime .env (wizard-written cluster config) lives in the volume.
      - NODE_STATS_ENV_FILE=/app/data/.env
      # Dokploy owns the lifecycle: no controller sidecar, updates = Redeploy.
      - NODE_STATS_MANAGED_EXTERNALLY=true
      - DB_TYPE=postgres
      - DB_DSN=host=db user=node_stats password=${DB_PASSWORD} dbname=node_stats port=5432 sslmode=disable
      # Pre-generated by the template so the app is fully configured on first
      # boot — the setup wizard only creates the admin account.
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_SECRET=${REFRESH_SECRET}
      # Host metrics from inside the container:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ETC=/host/etc
      - HOST_ROOT=/host

  db:
    image: postgres:16-alpine
    # Tuned for a small hub VPS (2 CPU/4GB): bounded memory/shared_buffers,
    # modest connection cap; shm_size lifts the 64MB Docker default.
    # PG flags mirror the controller-generated compose: env-overridable (set
    # NODE_STATS_PG_SHARED_BUFFERS / NODE_STATS_PG_MAX_CONNECTIONS in the dokploy
    # env to raise them on a bigger box) and wal_compression on to shrink WAL
    # volume — the workload is high-churn metric writes.
    mem_limit: 768m
    shm_size: 256mb
    command: postgres -c shared_buffers=${NODE_STATS_PG_SHARED_BUFFERS:-128MB} -c max_connections=${NODE_STATS_PG_MAX_CONNECTIONS:-16} -c wal_compression=on -c checkpoint_completion_target=0.9
    environment:
      - POSTGRES_DB=node_stats
      - POSTGRES_USER=node_stats
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U node_stats"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  node-stats-data:
  pgdata:

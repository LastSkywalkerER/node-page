# node-stats dokploy template (blueprints/node-stats).
# Conventions per Dokploy/templates: no container_name, no explicit
# dokploy-network (injected), expose-style ports only (domains route via
# Traefik to the container port). All mutable state lives in named volumes —
# dokploy re-clones the compose project on every redeploy.
services:
  node-stats:
    image: ghcr.io/lastskywalkerer/node-page:latest
    volumes:
      - node-stats-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro
      # Lets the Applications view derive public URLs from dokploy's Traefik
      # file-provider config:
      - /etc/dokploy/traefik/dynamic:/etc/dokploy/traefik/dynamic:ro
    pid: host
    ipc: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ADDR=:9090
      # Runtime .env (wizard-written cluster config) lives in the volume.
      - NODE_STATS_ENV_FILE=/app/data/.env
      # Dokploy owns the lifecycle: no controller sidecar, updates = Redeploy.
      - NODE_STATS_MANAGED_EXTERNALLY=true
      - DB_TYPE=postgres
      - DB_DSN=host=db user=node_stats password=${DB_PASSWORD} dbname=node_stats port=5432 sslmode=disable
      # Pre-generated by the template so the app is fully configured on first
      # boot — the setup wizard only creates the admin account.
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_SECRET=${REFRESH_SECRET}
      # Host metrics from inside the container:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ETC=/host/etc
      - HOST_ROOT=/host

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=node_stats
      - POSTGRES_USER=node_stats
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U node_stats"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  node-stats-data:
  pgdata:

# Generated by node-stats — do NOT edit by hand.
# The controller regenerates this file when the setup wizard changes the
# database/topology. Host capabilities (pid/ipc/network) live in
# docker-compose.override.yml, which Compose auto-merges and which this
# file never overwrites.
services:
  node-stats:
    image: ${NODE_STATS_IMAGE:-ghcr.io/lastskywalkerer/node-page:latest}
    ports:
      - "${NODE_STATS_PORT:-9090}:9090"
      - "${NODE_STATS_RAFT_PORT:-7000}:7000"
    volumes:
      - ./.env.agent:/app/.env
      - ./data/docker:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ADDR=:9090
      - GIN_MODE=${GIN_MODE:-release}
      - DB_TYPE=sqlite
      - DB_DSN=/app/data/stats.db
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ETC=/host/etc
      - HOST_ROOT=/host
      - NODE_HOST_ALIAS=host.docker.internal
      - NODE_STATS_IPV4=${NODE_STATS_IPV4:-}
      - NODE_STATS_HOSTNAME=${NODE_STATS_HOSTNAME:-}
    restart: unless-stopped
  node-stats-controller:
    image: ${NODE_STATS_IMAGE:-ghcr.io/lastskywalkerer/node-page:latest}
    command: ["controller"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${NODE_STATS_STACK_HOST_DIR}:${NODE_STATS_STACK_HOST_DIR}
    environment:
      - NODE_STATS_STACK_DIR=${NODE_STATS_STACK_HOST_DIR}
      - NODE_STATS_DATA_DIR=${NODE_STATS_STACK_HOST_DIR}/data/docker
      - NODE_STATS_APP_SERVICE=node-stats
      - NODE_STATS_PROJECT=${COMPOSE_PROJECT_NAME:-node-stats}
    restart: unless-stopped
